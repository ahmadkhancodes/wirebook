name: Create tag
# Creates an annotated tag from the Actions UI/API (cloud sessions cannot push tags through their git proxy).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag name, e.g. kit-v1
        required: true
      sha:
        description: Commit to tag (default = head of the default branch)
        required: false
permissions:
  contents: write
jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Tag and push
        env:
          TAG: ${{ inputs.tag }}
          SHA: ${{ inputs.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG" "${SHA:-HEAD}"
          git push origin "refs/tags/$TAG"
