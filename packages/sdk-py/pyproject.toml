[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wirebook"
version = "0.1.0"
description = "Python SDK for the Wirebook API: QuickBooks Desktop over REST and JSON."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []
keywords = ["quickbooks", "quickbooks-desktop", "qbxml", "wirebook", "sdk"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Typing :: Typed",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wirebook = ["py.typed"]
